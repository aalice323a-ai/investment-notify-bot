name: Update Watchlist (manual)

on:
  workflow_dispatch:
    inputs:
      watchlist_text:
        description: >
          監視銘柄リスト全体。1行1銘柄、"コード,名称,市場(JP/US)" 形式で貼り付けてください。
          例: 8035,東京エレクトロン,JP / NVDA,NVIDIA,US
          この内容で data/watchlist.json を全件置き換えます(部分更新ではありません)。
        required: true
        type: string

permissions:
  contents: write

jobs:
  run:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install dependencies (requests only)
        run: pip install requests

      - name: Update watchlist
        env:
          WATCHLIST_TEXT: ${{ github.event.inputs.watchlist_text }}
          LINE_CHANNEL_ACCESS_TOKEN: ${{ secrets.LINE_CHANNEL_ACCESS_TOKEN }}
          LINE_USER_ID: ${{ secrets.LINE_USER_ID }}
        run: python src/update_watchlist.py
